    <!-- ============================================
         ESTILOS DE CARGA INICIAL (Splash Screen)
         ============================================ -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #064e3b;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #065f46 100%);
        z-index: 9999;
        transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
      }

      #initial-loader.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loader-logo {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 4rem;
        font-weight: 900;
        letter-spacing: -0.05em;
        background: linear-gradient(135deg, #ffffff 0%, #fb7185 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
        animation: logoPulse 1.8s ease-in-out infinite;
      }

      .loader-sub {
        color: #fb7185;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        margin-bottom: 2.5rem;
        opacity: 0.9;
      }

      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(251, 113, 133, 0.2);
        border-top-color: #fb7185;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      .loader-tagline {
        color: #a7f3d0;
        font-size: 0.8rem;
        margin-top: 1.5rem;
        opacity: 0.7;
        letter-spacing: 0.05em;
      }

      @keyframes logoPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Fallback si JS está desactivado */
      .no-js-message {
        color: white;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>

  <body>
    <!-- ============================================
         SPLASH SCREEN (se oculta al cargar React)
         ============================================ -->
    <div id="initial-loader">
      <div class="loader-logo">FLC</div>
      <div class="loader-sub">Quality Control</div>
      <div class="loader-spinner"></div>
      <div class="loader-tagline">Cultivando excelencia...</div>
    </div>

    <!-- ============================================
         APP PRINCIPAL
         ============================================ -->
    <div id="root"></div>

    <!-- ============================================
         SCRIPT PRINCIPAL
         ============================================ -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- ============================================
         OCULTAR SPLASH CUANDO REACT ESTÉ LISTO
         ============================================ -->
    <script>
      // Ocultar el splash cuando el DOM de React esté montado
      const hideLoader = () => {
        const loader = document.getElementById('initial-loader');
        if (loader && !loader.classList.contains('hidden')) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 700);
        }
      };

      // Estrategia 1: MutationObserver sobre #root
      const root = document.getElementById('root');
      if (root) {
        const observer = new MutationObserver(() => {
          if (root.children.length > 0) {
            hideLoader();
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true, subtree: true });
      }

      // Estrategia 2: Fallback por si algo falla (máx 4s)
      setTimeout(hideLoader, 4000);

      // Estrategia 3: Al terminar la carga completa
      window.addEventListener('load', () => setTimeout(hideLoader, 300));
    </script>
  </body>
